name: Sales Bridge Sync (Google Sheets)

# Production Google Sheets push (US/UK/CA audit + master bridge).
# Streamlit/repo CSVs are built separately by intelligence_pipeline.yml (--dry-run).

on:
  schedule:
    # 4:00 AM CST (UTC-6) ≈ 10:00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      max_attempts:
        description: Max attempts (first run + retries until success)
        type: number
        default: 5
      retry_wait_minutes:
        description: Minutes to wait between failed attempts
        type: number
        default: 60

permissions:
  contents: read

env:
  # Override via repo Variables CI_RETRY_MAX_ATTEMPTS / CI_RETRY_WAIT_SECONDS if needed.
  CI_RETRY_MAX_ATTEMPTS: ${{ vars.CI_RETRY_MAX_ATTEMPTS || '5' }}
  CI_RETRY_WAIT_SECONDS: ${{ vars.CI_RETRY_WAIT_SECONDS || '3600' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    # (max_attempts - 1) × 1h wait + ~90m work; default 5 attempts ≈ 5.5h
    timeout-minutes: 360
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve retry settings
        id: retry
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "max=${{ github.event.inputs.max_attempts }}" >> "$GITHUB_OUTPUT"
            echo "wait_seconds=$(( ${{ github.event.inputs.retry_wait_minutes }} * 60 ))" >> "$GITHUB_OUTPUT"
          else
            echo "max=${CI_RETRY_MAX_ATTEMPTS}" >> "$GITHUB_OUTPUT"
            echo "wait_seconds=${CI_RETRY_WAIT_SECONDS}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Sales Bridge sheet (retry on failure)
        env:
          TRIPLE_WHALE_API_KEY: ${{ secrets.TRIPLE_WHALE_API_KEY }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          SALES_BRIDGE_SPREADSHEET_ID: ${{ secrets.SALES_BRIDGE_SPREADSHEET_ID }}
          AUDIT_BRIDGE_SPREADSHEET_ID_USA: ${{ secrets.AUDIT_BRIDGE_SPREADSHEET_ID_USA }}
          AUDIT_BRIDGE_SPREADSHEET_ID_UK: ${{ secrets.AUDIT_BRIDGE_SPREADSHEET_ID_UK }}
          AUDIT_BRIDGE_SPREADSHEET_ID_CAN: ${{ secrets.AUDIT_BRIDGE_SPREADSHEET_ID_CAN }}
        run: |
          chmod +x scripts/ci_retry.sh
          ./scripts/ci_retry.sh \
            --max "${{ steps.retry.outputs.max }}" \
            --wait-seconds "${{ steps.retry.outputs.wait_seconds }}" \
            -- python sync_sales_bridge.py

      - name: Archive sales history ledger
        if: success()
        run: python history_archive.py --bootstrap-sales || true
